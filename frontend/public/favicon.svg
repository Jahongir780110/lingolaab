<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none">
  <!-- Icon Mark centered on top or horizontal layout -->
  <g transform="translate(40, 0)">
    <!-- Left Purple outline -->
    <path d="M 120 20 C 95 20 50 20 40 32 C 30 44 30 96 30 110 C 30 124 45 136 70 136 C 95 136 110 136 120 136" 
          stroke="#531D5C" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Right Cyan outline with lower brain stem -->
    <path d="M 120 20 C 150 20 186 20 196 34 C 206 48 206 90 196 108 C 186 124 164 136 142 136 C 142 136 149 148 152 152" 
          stroke="#00A8CC" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Left Purple Network Interconnections -->
    <line x1="120" y1="20" x2="95" y2="68" stroke="#531D5C" stroke-width="7" stroke-linecap="round" />
    <line x1="95" y1="68" x2="42" y2="62" stroke="#531D5C" stroke-width="7" stroke-linecap="round" />
    <line x1="42" y1="62" x2="42" y2="114" stroke="#531D5C" stroke-width="7" stroke-linecap="round" />
    <line x1="42" y1="114" x2="122" y2="132" stroke="#531D5C" stroke-width="7" stroke-linecap="round" />
    <line x1="95" y1="68" x2="122" y2="132" stroke="#531D5C" stroke-width="7" stroke-linecap="round" />
    <line x1="42" y1="62" x2="122" y2="132" stroke="#531D5C" stroke-width="7" stroke-linecap="round" />

    <!-- Right Cyan Network Connections -->
    <line x1="120" y1="20" x2="150" y2="64" stroke="#00A8CC" stroke-width="7" stroke-linecap="round" />
    <line x1="95" y1="68" x2="150" y2="64" stroke="#00A8CC" stroke-width="7" stroke-linecap="round" />
    <line x1="150" y1="64" x2="194" y2="80" stroke="#00A8CC" stroke-width="7" stroke-linecap="round" />
    <line x1="150" y1="64" x2="152" y2="146" stroke="#00A8CC" stroke-width="7" stroke-linecap="round" />
    <line x1="122" y1="132" x2="152" y2="146" stroke="#00A8CC" stroke-width="7" stroke-linecap="round" />
    <line x1="194" y1="80" x2="152" y2="146" stroke="#00A8CC" stroke-width="7" stroke-linecap="round" />

    <!-- Purple Nodes -->
    <circle cx="120" cy="20" r="11" fill="#531D5C" />
    <circle cx="42" cy="62" r="11" fill="#531D5C" />
    <circle cx="95" cy="68" r="10" fill="#531D5C" />
    <circle cx="42" cy="114" r="9" fill="#531D5C" />
    <circle cx="122" cy="132" r="12" fill="#531D5C" />

    <!-- Cyan Nodes -->
    <circle cx="150" cy="64" r="11" fill="#00A8CC" />
    <circle cx="194" cy="80" r="11" fill="#00A8CC" />
    <circle cx="152" cy="146" r="10" fill="#00A8CC" />
  </g>
</svg>
